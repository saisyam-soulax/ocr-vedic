server {
    listen 80;
    # Responds to the bare IP, the mDNS hostname (.local), and any custom
    # alias you point at this machine (e.g. via /etc/hosts on a client).
    server_name _ spark-9d9c.local spark-9d9c vedic-ocr vedic-ocr.local;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500m;

    # App lives at http://<host>/ocr/
    location = / {
        return 302 /ocr/;
    }

    location = /ocr {
        return 301 /ocr/;
    }

    location /ocr/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /ocr/health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
    }

    location /ocr/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /ocr/index.html;

        # index.html must never be cached — it references hashed asset filenames
        # and caching it means users get stale JS/CSS after a redeploy.
        location ~* /ocr/index\.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Hashed assets (e.g. index-AbCdEf.js) — safe to cache for 1 year.
        location ~* /ocr/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
